name: 공개 진단 데이터 제안
description: 출처와 개인정보를 확인할 수 있는 DTC·차량 자료를 제안합니다.
title: "[데이터] 제조사 차종 연식 코드"
labels: ["data-candidate"]
body:
  - type: markdown
    attributes:
      value: |
        유료 자료의 본문·그림·PDF, 유출 자료, VIN·차량번호·전체 MAC 주소는 올리지 마십시오. 제안은 검수 전까지 앱 데이터가 아닙니다.
  - type: input
    id: dtc
    attributes:
      label: 전체 오류코드
      description: 접미사가 있으면 P3180-97처럼 모두 적어 주세요.
    validations:
      required: true
  - type: input
    id: vehicle
    attributes:
      label: 차량 적용 정보
      description: 제조사, 차종, 연식, 판매 국가, 동력계를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: 수신 상태와 발생 조건
      description: ECU 주소, 저장·보류·현재·과거 상태, 동반 코드, 측정 조건을 적어 주세요. 모르면 미확인이라고 적습니다.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 공개 원문 URL
      description: 제조사·정부기관·라이선스가 명확한 공개 저장소 링크만 가능합니다.
    validations:
      required: true
  - type: textarea
    id: interpretation
    attributes:
      label: 직접 작성한 설명과 확인 순서
      description: 원문을 복사하지 말고 확인된 사실과 미확인 부분을 구분해 주세요.
    validations:
      required: true
  - type: dropdown
    id: validation
    attributes:
      label: 검증 수준
      options:
        - 공개 원문만 확인
        - 실차 수신까지 확인
        - 기준 진단기와 대조
        - 정비 후 재확인까지 완료
    validations:
      required: true
  - type: checkboxes
    id: declarations
    attributes:
      label: 공개·개인정보 확인
      options:
        - label: 유료·유출 자료를 복사하지 않았고 이 내용을 공개 프로젝트에 제공할 권리가 있습니다.
          required: true
        - label: VIN, 차량번호, 전체 MAC, 이름, 연락처, 주소와 위치정보를 제거했습니다.
          required: true
        - label: 이 제안이 검증 전 자료이며 앱에 자동 등록되지 않는다는 점을 이해합니다.
          required: true
